name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: # lets publish.yml run the full CI before releasing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    # bash on every OS (Git Bash on Windows), so steps like "$POETRY_SPEC" work everywhere.
    shell: bash

env:
  FORCE_COLOR: "1"
  # Poetry 2.2+ is needed for PEP 735 dependency groups (see pyproject.toml).
  POETRY_SPEC: "poetry>=2.2,<3"

jobs:
  lock:
    name: poetry.lock is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install "$POETRY_SPEC"
      - name: Check poetry.lock matches pyproject.toml
        run: poetry check --lock

  static-checks:
    name: Lint and type-check
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install "$POETRY_SPEC"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry
      - name: Install tox from poetry.lock
        run: poetry sync --only tox --no-root
      - name: Ruff (lint + format) and mypy (strict)
        run: poetry run tox -e lint,type

  tests:
    name: Tests (Python ${{ matrix.python.version }}, ${{ matrix.os }})
    needs: lock
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python:
          - { version: "3.11", toxenv: py311 }
          - { version: "3.12", toxenv: py312 }
          - { version: "3.13", toxenv: py313 }
          - { version: "3.14", toxenv: py314 }
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install "$POETRY_SPEC"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python.version }}
          cache: poetry
      - name: Install tox from poetry.lock
        run: poetry sync --only tox --no-root
      - name: Run tests with locked dependencies
        run: poetry run tox -e ${{ matrix.python.toxenv }}

  dependency-range:
    name: Tests with ${{ matrix.env.name }} dependencies
    needs: lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - { name: lowest, python: "3.11" }
          - { name: latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install "$POETRY_SPEC"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.env.python }}
          cache: poetry
      - name: Install tox from poetry.lock
        run: poetry sync --only tox --no-root
      - name: Run tests ignoring poetry.lock
        run: poetry run tox -e ${{ matrix.env.name }}

  package:
    name: Build and smoke-test the distribution
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: pipx install "$POETRY_SPEC"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: poetry
      - name: Install build tools from poetry.lock
        run: poetry sync --only release --no-root
      - name: Build sdist and wheel
        run: poetry run python -m build
      - name: Check metadata is valid for PyPI
        run: poetry run twine check --strict dist/*
      - name: Install the wheel into a clean virtual environment and use it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          from faker import Faker
          from faker_vedic_astrology_birth_chart import VedicAstrologyProvider, validate_birth_chart

          fake = Faker()
          fake.add_provider(VedicAstrologyProvider)
          chart = fake.vedic_birth_chart()
          validate_birth_chart(chart, constrain_inner_planets=True)
          print(chart)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
