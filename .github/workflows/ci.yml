name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: # lets publish.yml run the full CI before releasing

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lock:
    name: uv.lock is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Check uv.lock matches pyproject.toml
        run: uv lock --check

  static-checks:
    name: Lint and type-check
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Ruff (lint + format) and mypy (strict)
        run: uv run --locked --only-group tox tox -e lint,type

  tests:
    name: Tests (Python ${{ matrix.python.version }}, ${{ matrix.os }})
    needs: lock
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python:
          - { version: "3.11", toxenv: py311 }
          - { version: "3.12", toxenv: py312 }
          - { version: "3.13", toxenv: py313 }
          - { version: "3.14", toxenv: py314 }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python.version }}
          enable-cache: true
      - name: Run tests with locked dependencies
        run: uv run --locked --only-group tox tox -e ${{ matrix.python.toxenv }}

  dependency-range:
    name: Tests with ${{ matrix.env.name }} dependencies
    needs: lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - { name: lowest, python: "3.11" }
          - { name: latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.env.python }}
          enable-cache: true
      - name: Run tests ignoring uv.lock
        run: uv run --locked --only-group tox tox -e ${{ matrix.env.name }}

  package:
    name: Build and smoke-test the distribution
    needs: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check metadata is valid for PyPI
        run: uv run --locked --only-group release twine check --strict dist/*
      - name: Install the wheel into a clean virtual environment and use it
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python - <<'PY'
          from faker import Faker
          from faker_vedic_astrology_birth_chart import VedicAstrologyProvider, validate_birth_chart

          fake = Faker()
          fake.add_provider(VedicAstrologyProvider)
          chart = fake.vedic_birth_chart()
          validate_birth_chart(chart, constrain_inner_planets=True)
          print(chart)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
