name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  static-checks:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install tox
        run: python -m pip install "tox>=4.22"
      - name: Ruff (lint + format)
        run: tox -e lint
      - name: Mypy (strict)
        run: tox -e type

  tests:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tox
        run: python -m pip install "tox>=4.22"
      - name: Run tests in an isolated environment
        run: tox -e py

  package:
    name: Build and smoke-test the distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          python -m pip install "build>=1.2" "twine>=6.1"
          python -m build
          twine check --strict dist/*
      - name: Install the wheel into a clean virtual environment and use it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python - <<'EOF'
          from faker import Faker
          from faker_vedic_astrology_birth_chart import VedicAstrologyProvider, validate_birth_chart

          fake = Faker()
          fake.add_provider(VedicAstrologyProvider)
          chart = fake.vedic_birth_chart()
          validate_birth_chart(chart, constrain_inner_planets=True)
          print(chart)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
