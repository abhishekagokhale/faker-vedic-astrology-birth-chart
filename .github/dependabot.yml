version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Keeps poetry.lock up to date. Dependabot uses the "pip" setting for
  # Poetry projects.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    # This is a library: pyproject.toml declares ranges (e.g. Faker>=30.0).
    # Only change a range when a new release falls outside it; otherwise just
    # refresh poetry.lock, so the minimum supported versions never move by
    # accident.
    versioning-strategy: increase-if-necessary
    groups:
      python-dependencies:
        patterns: ["*"]
