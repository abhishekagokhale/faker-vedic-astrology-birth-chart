# Install once with:   poetry run pre-commit install
# Run on everything:   poetry run pre-commit run --all-files
#
# Ruff and mypy run through `poetry run`, so the hooks use exactly the
# versions pinned in poetry.lock - the same ones tox and CI use.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: poetry-check-lock
        name: poetry.lock is up to date with pyproject.toml
        entry: poetry check --lock
        language: system
        files: ^(pyproject\.toml|poetry\.lock)$
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: poetry run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: poetry run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict)
        entry: poetry run mypy
        language: system
        types: [python]
        pass_filenames: false
