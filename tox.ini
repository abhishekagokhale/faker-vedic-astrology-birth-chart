# Run every check in its own isolated virtual environment.
#
#   tox                 # all environments in env_list
#   tox -e py313        # tests on one Python version
#   tox -e lint,type    # static checks only
#   tox p               # everything, in parallel
#
# Requires tox >= 4.22 for dependency_groups support.

[tox]
requires = tox>=4.22
env_list = py311, py312, py313, py314, lint, type, pkg
skip_missing_interpreters = true

[testenv]
description = run unit, integration and e2e tests against the built wheel
package = wheel
wheel_build_env = .pkg
dependency_groups = test
commands =
    pytest --cov --cov-report=term-missing --cov-report=xml {posargs}

[testenv:lint]
description = check style and formatting with ruff
skip_install = true
dependency_groups = lint
commands =
    ruff check {posargs:src tests}
    ruff format --check {posargs:src tests}

[testenv:type]
description = type-check the package and tests with mypy (strict)
dependency_groups = type
commands =
    mypy {posargs}

[testenv:pkg]
description = build the sdist and wheel and check they are valid for PyPI
skip_install = true
deps =
    build>=1.2
    twine>=6.1
commands =
    python -m build --outdir {env_tmp_dir}/dist {tox_root}
    twine check --strict {env_tmp_dir}/dist/*

[testenv:format]
description = auto-fix lint issues and reformat code
skip_install = true
dependency_groups = lint
commands =
    ruff check --fix src tests
    ruff format src tests
