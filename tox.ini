# Run every check in its own isolated virtual environment, using uv.
#
#   uv run tox              # everything in env_list
#   uv run tox -e py313     # tests on one Python version
#   uv run tox -e lint,type # static checks only
#   uv run tox p            # everything, in parallel
#
# Most environments install the exact versions pinned in uv.lock
# (runner = uv-venv-lock-runner), so local runs and CI use identical tools.
# Two environments deliberately ignore the lock file:
#
#   lowest  - the oldest versions pyproject.toml allows (e.g. Faker 30.0),
#             proving the minimum version claims are true
#   latest  - the newest versions on PyPI, giving early warning when a new
#             Faker release breaks something before uv.lock is updated

[tox]
requires =
    tox>=4.40
    tox-uv>=1.34
env_list = py311, py312, py313, py314, lowest, latest, lint, type, pkg
skip_missing_interpreters = true

[testenv]
description = run unit, integration and e2e tests against the built wheel (locked versions)
runner = uv-venv-lock-runner
package = wheel
dependency_groups = test
commands =
    pytest --cov --cov-report=term-missing --cov-report=xml {posargs}

[testenv:lowest]
description = run tests with the oldest dependency versions pyproject.toml allows
runner = uv-venv-runner
uv_resolution = lowest-direct
base_python = py311
# Show which Faker was installed, so the log proves the minimum was tested.
commands_pre =
    python -c "import faker; print('Testing against Faker', faker.VERSION)"

[testenv:latest]
description = run tests with the newest dependency versions available, ignoring uv.lock
runner = uv-venv-runner
uv_resolution = highest
base_python = py314

[testenv:lint]
description = check style and formatting with ruff
package = skip
only_groups = lint
# Clear the "test" group inherited from [testenv]: uv rejects --group with --only-group.
dependency_groups =
commands =
    ruff check {posargs:src tests}
    ruff format --check {posargs:src tests}

[testenv:type]
description = type-check the package and tests with mypy (strict)
dependency_groups = type
commands =
    mypy {posargs}

[testenv:pkg]
description = build the sdist and wheel and check they are valid for PyPI
package = skip
only_groups = release
# Clear the "test" group inherited from [testenv]: uv rejects --group with --only-group.
dependency_groups =
commands =
    python -m build --outdir {env_tmp_dir}/dist {tox_root}
    twine check --strict {env_tmp_dir}/dist/*

[testenv:format]
description = auto-fix lint issues and reformat code
package = skip
only_groups = lint
# Clear the "test" group inherited from [testenv]: uv rejects --group with --only-group.
dependency_groups =
commands =
    ruff check --fix src tests
    ruff format src tests
