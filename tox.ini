# Run every check in its own isolated virtual environment.
#
#   poetry run tox              # everything in env_list
#   poetry run tox -e py313     # tests on one Python version
#   poetry run tox -e lint,type # static checks only
#   poetry run tox p            # everything, in parallel
#
# Most environments install the exact versions pinned in poetry.lock: tox
# creates the virtual environment, then `poetry sync` fills it (Poetry
# installs into the environment tox has activated). The project itself is
# installed in editable mode there.
#
# Two environments deliberately ignore the lock file and test the built wheel:
#
#   lowest  - the oldest Faker pyproject.toml allows (Faker 30.0), proving the
#             minimum version claim is true
#   latest  - the newest versions on PyPI, giving early warning when a new
#             Faker release breaks something before poetry.lock is updated
#
# Poetry must be installed and on PATH (see CONTRIBUTING.md).

[tox]
requires = tox>=4.22
env_list = py311, py312, py313, py314, lowest, latest, lint, type, pkg
skip_missing_interpreters = true

[testenv]
description = run unit, integration and e2e tests with the versions in poetry.lock
skip_install = true
allowlist_externals = poetry
commands_pre =
    poetry sync --only main,test
commands =
    pytest --cov --cov-report=term-missing --cov-report=xml {posargs}

[testenv:lowest]
description = run tests against the built wheel with the oldest Faker allowed
skip_install = false
package = wheel
base_python = py311
dependency_groups = test
# Keep this in step with the Faker lower bound in pyproject.toml.
deps = Faker==30.0
# Show which Faker was installed, so the log proves the minimum was tested.
commands_pre =
    python -c "import faker; print('Testing against Faker', faker.VERSION)"

[testenv:latest]
description = run tests against the built wheel with the newest releases, ignoring poetry.lock
skip_install = false
package = wheel
base_python = py314
dependency_groups = test
commands_pre =

[testenv:lint]
description = check style and formatting with ruff
commands_pre =
    poetry sync --only lint --no-root
commands =
    ruff check {posargs:src tests}
    ruff format --check {posargs:src tests}

[testenv:type]
description = type-check the package and tests with mypy (strict)
commands_pre =
    poetry sync --only main,type
commands =
    mypy {posargs}

[testenv:pkg]
description = build the sdist and wheel and check they are valid for PyPI
commands_pre =
    poetry sync --only release --no-root
commands =
    python -m build --outdir {env_tmp_dir}/dist {tox_root}
    twine check --strict {env_tmp_dir}/dist/*

[testenv:format]
description = auto-fix lint issues and reformat code
commands_pre =
    poetry sync --only lint --no-root
commands =
    ruff check --fix src tests
    ruff format src tests
